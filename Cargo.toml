[package]
name = "battlezone"
version = "1.0.0"
edition = "2024"
autobins = false
default-run = "battlezone"

[[bin]]
name = "battlezone"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
fastrand = "2.3"
pollster = "0.4"
rodio = "0.22"
wgpu = "29"
winit = "0.30"

[dev-dependencies]
gif = "0.14"
png = "0.18"
